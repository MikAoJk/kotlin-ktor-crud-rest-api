openapi: "3.1.0"
info:
  title: "kotlin_ktor_crud_rest_api API"
  description: "kotlin_ktor_crud_rest_api API"
  version: "1.0.0"
servers:
- url: "https://kotlin_ktor_crud_rest_api"
paths:
  /users:
    post:
      requestBody:
        $ref: "#/components/requestBodies/User"
      responses:
        "200":
          description: "Unquoted body: User created"
          content:
            application/json:
              schema:
                type: string
              example: "User created"
        "500":
          $ref: "#/components/responses/InternalError"
    get:
      responses:
        "200":
          description: "All users"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserInDB"
        "500":
          $ref: "#/components/responses/InternalError"
  /users/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int32
    get:
      responses:
        "200":
          description: "User"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserInDB"
        "404":
          $ref: "#/components/responses/UserNotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    put:
      requestBody:
        $ref: "#/components/requestBodies/User"
      responses:
        "200":
          description: "Unquoted body: User updated. Also returned for a nonexistent user."
          content:
            application/json:
              schema:
                type: string
              example: "User updated"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      responses:
        "200":
          description: "Unquoted body: User deleted"
          content:
            application/json:
              schema:
                type: string
              example: "User deleted"
        "404":
          $ref: "#/components/responses/UserNotFound"
        "500":
          $ref: "#/components/responses/InternalError"
components:
  requestBodies:
    User:
      required: true
      description: "JSON body; Content-Type header is not required."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/UserRequest"
  responses:
    InternalError:
      description: "Body: Internal error. No Content-Type header."
    UserNotFound:
      description: "Body: User not found. No Content-Type header."
  schemas:
    UserRequest:
      type: object
      properties:
        id:
          type: [integer, "null"]
          format: int32
          description: "Optional and ignored."
        name:
          type: string
        email:
          type: string
      required: [name, email]
    UserInDB:
      type: object
      properties:
        id:
          type: integer
          format: int32
        name:
          type: string
        email:
          type: string
      required: [id, name, email]
