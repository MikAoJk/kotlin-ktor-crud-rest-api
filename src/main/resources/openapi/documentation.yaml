openapi: "3.1.0"
info:
  title: "kotlin_ktor_crud_rest_api API"
  description: "kotlin_ktor_crud_rest_api API"
  version: "1.0.0"
servers:
- url: "https://kotlin_ktor_crud_rest_api"
paths:
  /metrics:
    get:
      summary: "Current JVM process resource metrics"
      description: "Linux only. No Docker API access or database connection is required."
      responses:
        "200":
          description: "Process resource sample"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProcessMetrics"
        "500":
          $ref: "#/components/responses/InternalError"
  /users:
    post:
      requestBody:
        $ref: "#/components/requestBodies/User"
      responses:
        "200":
          description: "Unquoted body: User created"
          content:
            application/json:
              schema:
                type: string
              example: "User created"
        "500":
          $ref: "#/components/responses/InternalError"
    get:
      responses:
        "200":
          description: "All users"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserInDB"
        "500":
          $ref: "#/components/responses/InternalError"
  /users/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int32
    get:
      responses:
        "200":
          description: "User"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserInDB"
        "404":
          $ref: "#/components/responses/UserNotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    put:
      requestBody:
        $ref: "#/components/requestBodies/User"
      responses:
        "200":
          description: "Unquoted body: User updated. Also returned for a nonexistent user."
          content:
            application/json:
              schema:
                type: string
              example: "User updated"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      responses:
        "200":
          description: "Unquoted body: User deleted"
          content:
            application/json:
              schema:
                type: string
              example: "User deleted"
        "404":
          $ref: "#/components/responses/UserNotFound"
        "500":
          $ref: "#/components/responses/InternalError"
components:
  requestBodies:
    User:
      required: true
      description: "JSON body; Content-Type header is not required."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/UserRequest"
  responses:
    InternalError:
      description: "Body: Internal error. No Content-Type header."
    UserNotFound:
      description: "Body: User not found. No Content-Type header."
  schemas:
    ProcessMetrics:
      type: object
      required: [cpu_seconds_total, memory_rss_bytes, process_id, sampled_at_unix_seconds]
      properties:
        cpu_seconds_total:
          type: number
          format: double
          minimum: 0
          description: "Cumulative user and system CPU time in seconds."
        memory_rss_bytes:
          type: integer
          format: int64
          minimum: 1
          description: "Current process resident memory in bytes, from /proc/self/status."
        process_id:
          type: integer
          format: int64
          minimum: 1
        sampled_at_unix_seconds:
          type: number
          format: double
          description: "Sample timestamp as Unix seconds, including fractional seconds."
    UserRequest:
      type: object
      properties:
        id:
          type: [integer, "null"]
          format: int32
          description: "Optional and ignored."
        name:
          type: string
        email:
          type: string
      required: [name, email]
    UserInDB:
      type: object
      properties:
        id:
          type: integer
          format: int32
        name:
          type: string
        email:
          type: string
      required: [id, name, email]
